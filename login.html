<!doctype html>
<html lang="kk" class="no-js">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Кіру — Мансап Компасы</title>
  <meta name="description" content="Мансап Компасына телефон нөмірі немесе Google арқылы кіру.">
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body data-page="auth">

<!-- Компас белгісі -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="brandGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B46AE6"/>
      <stop offset="1" stop-color="#E8506A"/>
    </linearGradient>
    <symbol id="compass" viewBox="0 0 40 40">
      <circle cx="20" cy="20" r="18" fill="none" stroke="currentColor" stroke-width="2.5"/>
      <rect x="19" y="5" width="2" height="4" rx="1" fill="currentColor"/>
      <rect x="31" y="19" width="4" height="2" rx="1" fill="currentColor"/>
      <rect x="19" y="31" width="2" height="4" rx="1" fill="currentColor"/>
      <rect x="5" y="19" width="4" height="2" rx="1" fill="currentColor"/>
      <g transform="rotate(45 20 20)">
        <path d="M20 8 L24.5 20 L15.5 20 Z" fill="url(#brandGrad)"/>
        <path d="M15.5 20 L24.5 20 L20 32 Z" fill="currentColor"/>
      </g>
      <circle cx="20" cy="20" r="2.5" fill="#fff" stroke="#2A0D20"/>
    </symbol>
  </defs>
</svg>

<main class="auth">
  <div class="auth__frame">
    <p class="auth__where">Сіз <a href="index.html"><svg><use href="#compass"/></svg>Мансап Компасы</a> сайтына кіресіз</p>

    <div class="auth__card">
      <!-- 1. Телефон нөмірі немесе Google -->
      <section class="auth__step" data-step="phone">
        <h1>Кіру немесе тіркелу</h1>
        <form id="phoneForm" novalidate>
          <label class="field"><span>Телефон нөмірі</span>
            <span class="field__phone">
              <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="2.5" width="12" height="19" rx="2.5"/><path d="M10.5 18.5h3"/></svg>
              <em>+7</em>
              <input type="tel" name="phone" inputmode="numeric" autocomplete="tel-national" placeholder="700 000 00 00" maxlength="13" required>
            </span>
          </label>
          <p class="auth__msg" role="alert" hidden></p>
          <button type="submit" class="auth__btn">Жалғастыру</button>
        </form>
        <div class="auth__or"><span>немесе</span></div>
        <div class="auth__google" id="googleSlot">
          <button type="button" class="auth__alt" id="googleFallback">
            <svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>
            Google арқылы жалғастыру
          </button>
        </div>
        <p class="auth__msg" id="googleMsg" role="alert" hidden></p>
      </section>

      <!-- 2а. Тіркелген нөмір: құпиясөз -->
      <section class="auth__step" data-step="password" hidden>
        <button type="button" class="auth__back" data-back>← <span class="auth__phone-label"></span> · өзгерту</button>
        <h1>Құпиясөзді енгізіңіз</h1>
        <form id="loginForm" novalidate>
          <label class="field"><span>Құпиясөз</span>
            <span class="field__pw"><input type="password" name="password" autocomplete="current-password" required>
              <button type="button" class="field__eye" aria-label="Құпиясөзді көрсету">Көрсету</button></span></label>
          <label class="check"><input type="checkbox" name="remember" checked><i></i>Мені есте сақта</label>
          <p class="auth__msg" role="alert" hidden></p>
          <button type="submit" class="auth__btn">Кіру</button>
        </form>
      </section>

      <!-- 2ә. Жаңа нөмір немесе Google: тіркелу -->
      <section class="auth__step" data-step="register" hidden>
        <button type="button" class="auth__back" data-back>← Артқа</button>
        <h1>Аккаунт жасау</h1>
        <p class="auth__sub" id="regFor"></p>
        <form id="registerForm" novalidate>
          <label class="field"><span>Аты-жөні</span>
            <input type="text" name="fullName" autocomplete="name" placeholder="Айгерім Сейітова" required></label>
          <fieldset class="roles">
            <legend>Мен —</legend>
            <label class="role"><input type="radio" name="role" value="student" checked><span>Студент</span></label>
            <label class="role"><input type="radio" name="role" value="employer"><span>Жұмыс беруші</span></label>
            <label class="role"><input type="radio" name="role" value="education"><span>Оқу орны</span></label>
          </fieldset>
          <div class="org" hidden>
            <label class="field"><span id="orgLabel">Ұйым атауы</span>
              <input type="text" name="orgName" autocomplete="organization" placeholder="Мысалы: «Алатау Тех» ЖШС"></label>
            <div class="org__row">
              <label class="field" data-only="employer"><span>Сала</span><select name="sector"><option value="">Таңдаңыз</option></select></label>
              <label class="field"><span>Өңір</span><select name="region"><option value="">Таңдаңыз</option></select></label>
            </div>
          </div>
          <label class="field" data-pw><span>Құпиясөз ойлап табыңыз</span>
            <span class="field__pw"><input type="password" name="password" autocomplete="new-password" placeholder="Кемінде 8 таңба, әріп және сан">
              <button type="button" class="field__eye" aria-label="Құпиясөзді көрсету">Көрсету</button></span>
            <span class="pw-meter" aria-hidden="true"><i></i><i></i><i></i><i></i></span></label>
          <p class="auth__msg" role="alert" hidden></p>
          <button type="submit" class="auth__btn">Тіркелу</button>
        </form>
      </section>
    </div>
  </div>
  <p class="auth__below">Басты бетке <a href="index.html">оралу</a></p>
</main>

<script src="js/mk-auth.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
